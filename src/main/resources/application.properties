spring.application.name=stockapihb

# ==========================
# DataSource (H2)
# ==========================
spring.datasource.url=jdbc:h2:mem:midb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================
# JPA + H2
# ==========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================
# Consola H2 (acceso: /h2-console)
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# ==========================
# Reglas de stock
# ==========================
# stock minimo por defecto de cada fila Producto+Tienda. Cuando el stock baja de
# este valor (p.ej. de 12 a 11) se genera una notificacion (ver /api/notificaciones)
stock.minimo-por-defecto=12

# ==========================
# Seguridad JWT + Admin inicial
# ==========================
security.jwt.secret=stockapihb-clave-secreta-hmac-sha256-muy-segura-2026-minimo-32-bytes
security.jwt.expiration-seconds=28800
security.admin.username=admin
security.admin.password=admin123
