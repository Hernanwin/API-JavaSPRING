<div class="bg-surface-900 border border-surface-800 rounded-xl p-4">
  <div class="flex items-center gap-2 mb-3">
    <span class="w-1.5 h-1.5 rounded-full bg-red-400 inline-block"></span>
    <h2 class="font-medium text-surface-100">Reposicion sugerida</h2>
    <span class="text-xs text-surface-500">{{ items().length }} productos bajo minimo</span>
  </div>

  <div class="grid grid-cols-3 gap-3">
    @for (item of items(); track item.id) {
      <div class="bg-surface-800/60 border border-surface-700 rounded-lg p-3 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium">{{ item.nombreProducto }}</p>
          <p class="text-xs text-surface-500">{{ item.nombreTienda }}</p>
        </div>
        <p class="text-sm font-mono text-red-400">{{ item.cantidad }}/{{ item.stockMinimo ?? 12 }}</p>
      </div>
    } @empty {
      <p class="text-sm text-surface-500 py-2 col-span-3 text-center">Nada bajo minimo por ahora.</p>
    }
  </div>
</div>
